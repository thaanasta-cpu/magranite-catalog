AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/9k=" alt="Magranite — Products for Stones"></a><div class="head-label">DIGITAL CATALOG<span>PRODUCTS FOR STONES</span></div></div><div class="accent"></div></header><main><div class="intro"><div><div class="eyebrow">MAGRANITE · PRODUCT LIBRARY</div><h1>Ψηφιακοί κατάλογοι</h1></div><span id="catalogTitle">Κατάλογος προϊόντων</span></div><div id="error" role="alert"></div><div class="toolbar"><select id="catalog" aria-label="Επιλογή καταλόγου"></select><span class="divider"></span><button id="prev" title="Προηγούμενη σελίδα" aria-label="Προηγούμενη σελίδα">←</button><input id="page" type="number" min="1" value="1" aria-label="Αριθμός σελίδας"><span id="total">/ —</span><button id="next" title="Επόμενη σελίδα" aria-label="Επόμενη σελίδα">→</button><span class="divider"></span><button id="minus" title="Σμίκρυνση">−</button><button id="plus" title="Μεγέθυνση">+</button><button id="fit" title="Προσαρμογή στο πλάτος">Πλάτος</button><button id="fullscreen" title="Πλήρης οθόνη">⛶</button><button id="copy" class="primary push">Αντιγραφή link</button><a id="download" class="action" href="#" download>PDF ↓</a></div><div id="status">Φόρτωση καταλόγου…</div><div class="viewer" id="viewer"><div class="sheet"><canvas id="canvas"></canvas></div></div><p class="hint">Στείλτε σύνδεσμο προς οποιαδήποτε σελίδα. Ο παραλήπτης μπορεί να περιηγηθεί σε ολόκληρο τον κατάλογο.</p></main><footer class="footer">© MAGRANITE · PRODUCTS FOR STONES</footer><script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let catalogs=[],doc=null,current=1,zoom=1,renderToken=0,active=null;const status=$('status');
function hashPage(){const m=location.hash.match(/(?:^#|&)page=(\d+)/);return m?Math.max(1,Number(m[1])):1}
function setError(s){$('error').textContent=s;$('error').style.display='block';status.textContent=''}
function cleanPath(p){return typeof p==='string'&&/^catalogs\/[a-zA-Z0-9._/-]+\.pdf$/i.test(p)&&!p.split('/').includes('..')}
function setUrl(){const u=new URL(location.href);u.searchParams.set('catalog',active.id);u.hash=`page=${current}`;history.replaceState(null,'',u)}
async function render(){if(!doc)return;const token=++renderToken;current=Math.min(Math.max(1,current),doc.numPages);$('page').value=current;$('total').textContent=`/ ${doc.numPages}`;$('prev').disabled=current===1;$('next').disabled=current===doc.numPages;setUrl();status.textContent=`Σελίδα ${current} από ${doc.numPages}`;try{const page=await doc.getPage(current);if(token!==renderToken)return;const natural=page.getViewport({scale:1});const available=Math.max(220,$('viewer').clientWidth-32);const scale=(available/natural.width)*zoom;const vp=page.getViewport({scale});const dpr=Math.min(devicePixelRatio||1,2.5);const canvas=$('canvas');canvas.width=Math.floor(vp.width*dpr);canvas.height=Math.floor(vp.height*dpr);canvas.style.width=`${vp.width}px`;canvas.style.height=`${vp.height}px`;const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport:vp,transform:[dpr,0,0,dpr,0,0]}).promise;if(token===renderToken)status.textContent='';}catch(e){if(token===renderToken)setError('Δεν ήταν δυνατή η εμφάνιση της σελίδας: '+e.message)}}
async function load(id){const item=catalogs.find(x=>x.id===id)||catalogs[0];if(!item)return;active=item;$('catalog').value=item.id;$('catalogTitle').textContent=item.title;document.title=item.title+' | Magranite';$('error').style.display='none';status.textContent='Φόρτωση PDF…';renderToken++;if(doc){await doc.destroy();doc=null}try{doc=await pdfjsLib.getDocument({url:item.file}).promise;$('download').href=item.file;$('download').download=item.file.split('/').pop();current=hashPage();zoom=1;await render()}catch(e){setError('Δεν βρέθηκε ο κατάλογος. Βεβαιωθείτε ότι το PDF έχει ανέβει στο φάκελο catalogs και το όνομα ταιριάζει στο catalogs.json. ('+e.message+')')}}
$('prev').onclick=()=>{if(current>1){current--;render()}};$('next').onclick=()=>{if(doc&&current<doc.numPages){current++;render()}};$('page').onchange=()=>{current=Number($('page').value)||1;render()};$('minus').onclick=()=>{zoom=Math.max(.5,zoom-.2);render()};$('plus').onclick=()=>{zoom=Math.min(3,zoom+.2);render()};$('fit').onclick=()=>{zoom=1;render()};$('fullscreen').onclick=()=>{if(!document.fullscreenElement){$('viewer').requestFullscreen?.()}else{document.exitFullscreen?.()}};$('copy').onclick=async()=>{setUrl();try{await navigator.clipboard.writeText(location.href);$('copy').textContent='Αντιγράφηκε ✓';setTimeout(()=>$('copy').textContent='Αντιγραφή link',1600)}catch{prompt('Αντιγράψτε το link:',location.href)}};$('catalog').onchange=e=>{location.hash='page=1';load(e.target.value)};window.addEventListener('hashchange',()=>{if(doc){current=hashPage();render()}});window.addEventListener('resize',()=>{if(doc)render()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&doc&&current<doc.numPages){current++;render()}if(e.key==='ArrowLeft'&&current>1){current--;render()}});
try{const res=await fetch('catalogs.json',{cache:'no-store'});if(!res.ok)throw Error('catalogs.json not found');const data=await res.json();catalogs=(Array.isArray(data)?data:data.catalogs||[]).filter(x=>x.id&&x.title&&cleanPath(x.file));if(!catalogs.length)throw Error('Δεν υπάρχουν καταχωρισμένοι κατάλογοι');$('catalog').innerHTML='';for(const c of catalogs){const o=document.createElement('option');o.value=c.id;o.textContent=c.title;$('catalog').append(o)}await load(params.get('catalog'))}catch(e){setError('Σφάλμα ρύθμισης: '+e.message)}
