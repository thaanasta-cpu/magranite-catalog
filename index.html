<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Magranite | Ψηφιακοί Κατάλογοι</title><meta name="description" content="Ψηφιακοί κατάλογοι προϊόντων Magranite. Προβολή και κοινοποίηση συγκεκριμένων σελίδων."><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#21252b;background:#f4f5f6}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e5e5;box-shadow:0 2px 12px #00000009}.head{max-width:1360px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:20px;text-decoration:none;color:inherit}.brand img{display:block;width:min(340px,45vw);height:auto}.head-label{border-left:3px solid #ed5409;padding-left:16px;font-size:12px;letter-spacing:.16em;font-weight:750;color:#555;text-transform:uppercase}.head-label span{display:block;font-size:11px;letter-spacing:.04em;color:#9b9b9b;margin-top:4px;font-weight:500}.accent{height:4px;background:linear-gradient(90deg,#ee5409 0%,#ee5409 22%,#292929 22%,#292929 100%)}main{max-width:1360px;margin:auto;padding:26px 24px 32px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#e8530c;text-transform:uppercase;margin-bottom:6px}h1{font-size:clamp(21px,2.5vw,31px);margin:0;font-weight:750;letter-spacing:-.03em}#catalogTitle{font-size:13px;color:#777}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#fff;padding:12px;border:1px solid #e8e8e8;border-radius:12px;box-shadow:0 4px 24px #00000008;margin-bottom:16px}button,a.action,select,input{border:1px solid #ddd;border-radius:7px;padding:10px 12px;font:inherit;font-size:13px;background:#fff;color:#242424;min-height:40px}button{cursor:pointer}button:hover,a.action:hover{border-color:#ed5409;color:#d94c07;background:#fff8f4}button:disabled{opacity:.35;cursor:default}button.primary{background:#e9560c;color:#fff;border-color:#e9560c;font-weight:650}button.primary:hover{background:#c94607;color:#fff}select{max-width:300px;min-width:180px;flex:1}input[type=number]{width:65px;text-align:center}a.action{text-decoration:none;display:inline-flex;align-items:center}.push{margin-left:auto}.divider{height:25px;width:1px;background:#e8e8e8;margin:0 3px}.viewer{display:flex;justify-content:center;align-items:flex-start;min-height:60vh;padding:24px;background:#e2e4e6;border:1px solid #d8dade;border-radius:12px;overflow:auto}.viewer:fullscreen{border-radius:0;padding:24px;background:#d4d6d8}.sheet{position:relative;box-shadow:0 6px 28px #00000026;max-width:none;background:white}.sheet canvas{display:block}#status{padding:10px;color:#666;text-align:center;min-height:32px;font-size:13px}.hint{font-size:12px;color:#777;text-align:center;margin:17px 0}#error{display:none;color:#9b2828;background:#fff0ed;border:1px solid #ffd6ca;padding:16px;border-radius:10px;margin-bottom:12px}.footer{border-top:1px solid #e3e3e3;padding:20px 24px;text-align:center;font-size:11px;color:#888} @media(max-width:700px){.head{padding:12px 16px}.brand img{width:min(245px,58vw)}.head-label{font-size:9px;letter-spacing:.06em;padding-left:9px}.head-label span{display:none}main{padding:18px 10px}.intro{padding:0 5px}.toolbar{gap:6px;padding:8px}.toolbar button,.toolbar a.action,.toolbar select{padding:8px}.toolbar select{max-width:none;flex-basis:100%}.push{margin-left:0}.viewer{padding:8px;min-height:55vh}.divider{display:none}#catalogTitle{display:none}}</style></head><body><header><div class="head"><a class="brand" href="./" aria-label="Magranite Digital Catalog"><img src="assets/magranite-logo.jpg" alt="Magranite — Products for Stones"></a><div class="head-label">DIGITAL CATALOG<span>PRODUCTS FOR STONES</span></div></div><div class="accent"></div></header><main><div class="intro"><div><div class="eyebrow">MAGRANITE · PRODUCT LIBRARY</div><h1>Ψηφιακοί κατάλογοι</h1></div><span id="catalogTitle">Κατάλογος προϊόντων</span></div><div id="error" role="alert"></div><div class="toolbar"><select id="catalog" aria-label="Επιλογή καταλόγου"></select><span class="divider"></span><button id="prev" title="Προηγούμενη σελίδα" aria-label="Προηγούμενη σελίδα">←</button><input id="page" type="number" min="1" value="1" aria-label="Αριθμός σελίδας"><span id="total">/ —</span><button id="next" title="Επόμενη σελίδα" aria-label="Επόμενη σελίδα">→</button><span class="divider"></span><button id="minus" title="Σμίκρυνση">−</button><button id="plus" title="Μεγέθυνση">+</button><button id="fit" title="Προσαρμογή στο πλάτος">Πλάτος</button><button id="fullscreen" title="Πλήρης οθόνη">⛶</button><button id="copy" class="primary push">Αντιγραφή link</button><a id="download" class="action" href="#" download>PDF ↓</a></div><div id="status">Φόρτωση καταλόγου…</div><div class="viewer" id="viewer"><div class="sheet"><canvas id="canvas"></canvas></div></div><p class="hint">Στείλτε σύνδεσμο προς οποιαδήποτε σελίδα. Ο παραλήπτης μπορεί να περιηγηθεί σε ολόκληρο τον κατάλογο.</p></main><footer class="footer">© MAGRANITE · PRODUCTS FOR STONES</footer><script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let catalogs=[],doc=null,current=1,zoom=1,renderToken=0,active=null;const status=$('status');
function hashPage(){const m=location.hash.match(/(?:^#|&)page=(\d+)/);return m?Math.max(1,Number(m[1])):1}
function setError(s){$('error').textContent=s;$('error').style.display='block';status.textContent=''}
function cleanPath(p){return typeof p==='string'&&/^catalogs\/[a-zA-Z0-9._/-]+\.pdf$/i.test(p)&&!p.split('/').includes('..')}
function setUrl(){const u=new URL(location.href);u.searchParams.set('catalog',active.id);u.hash=`page=${current}`;history.replaceState(null,'',u)}
async function render(){if(!doc)return;const token=++renderToken;current=Math.min(Math.max(1,current),doc.numPages);$('page').value=current;$('total').textContent=`/ ${doc.numPages}`;$('prev').disabled=current===1;$('next').disabled=current===doc.numPages;setUrl();status.textContent=`Σελίδα ${current} από ${doc.numPages}`;try{const page=await doc.getPage(current);if(token!==renderToken)return;const natural=page.getViewport({scale:1});const available=Math.max(220,$('viewer').clientWidth-32);const scale=(available/natural.width)*zoom;const vp=page.getViewport({scale});const dpr=Math.min(devicePixelRatio||1,2.5);const canvas=$('canvas');canvas.width=Math.floor(vp.width*dpr);canvas.height=Math.floor(vp.height*dpr);canvas.style.width=`${vp.width}px`;canvas.style.height=`${vp.height}px`;const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport:vp,transform:[dpr,0,0,dpr,0,0]}).promise;if(token===renderToken)status.textContent='';}catch(e){if(token===renderToken)setError('Δεν ήταν δυνατή η εμφάνιση της σελίδας: '+e.message)}}
async function load(id){const item=catalogs.find(x=>x.id===id)||catalogs[0];if(!item)return;active=item;$('catalog').value=item.id;$('catalogTitle').textContent=item.title;document.title=item.title+' | Magranite';$('error').style.display='none';status.textContent='Φόρτωση PDF…';renderToken++;if(doc){await doc.destroy();doc=null}try{doc=await pdfjsLib.getDocument({url:item.file}).promise;$('download').href=item.file;$('download').download=item.file.split('/').pop();current=hashPage();zoom=1;await render()}catch(e){setError('Δεν βρέθηκε ο κατάλογος. Βεβαιωθείτε ότι το PDF έχει ανέβει στο φάκελο catalogs και το όνομα ταιριάζει στο catalogs.json. ('+e.message+')')}}
$('prev').onclick=()=>{if(current>1){current--;render()}};$('next').onclick=()=>{if(doc&&current<doc.numPages){current++;render()}};$('page').onchange=()=>{current=Number($('page').value)||1;render()};$('minus').onclick=()=>{zoom=Math.max(.5,zoom-.2);render()};$('plus').onclick=()=>{zoom=Math.min(3,zoom+.2);render()};$('fit').onclick=()=>{zoom=1;render()};$('fullscreen').onclick=()=>{if(!document.fullscreenElement){$('viewer').requestFullscreen?.()}else{document.exitFullscreen?.()}};$('copy').onclick=async()=>{setUrl();try{await navigator.clipboard.writeText(location.href);$('copy').textContent='Αντιγράφηκε ✓';setTimeout(()=>$('copy').textContent='Αντιγραφή link',1600)}catch{prompt('Αντιγράψτε το link:',location.href)}};$('catalog').onchange=e=>{location.hash='page=1';load(e.target.value)};window.addEventListener('hashchange',()=>{if(doc){current=hashPage();render()}});window.addEventListener('resize',()=>{if(doc)render()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&doc&&current<doc.numPages){current++;render()}if(e.key==='ArrowLeft'&&current>1){current--;render()}});
try{const res=await fetch('catalogs.json',{cache:'no-store'});if(!res.ok)throw Error('catalogs.json not found');const data=await res.json();catalogs=(Array.isArray(data)?data:data.catalogs||[]).filter(x=>x.id&&x.title&&cleanPath(x.file));if(!catalogs.length)throw Error('Δεν υπάρχουν καταχωρισμένοι κατάλογοι');$('catalog').innerHTML='';for(const c of catalogs){const o=document.createElement('option');o.value=c.id;o.textContent=c.title;$('catalog').append(o)}await load(params.get('catalog'))}catch(e){setError('Σφάλμα ρύθμισης: '+e.message)}
</script></body></html>
